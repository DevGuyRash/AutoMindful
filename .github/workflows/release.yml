name: Release to Steam Workshop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag to check or retry, such as v0.1.0
        required: true
        type: string
      publish:
        description: Update the latest published release on Steam Workshop
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: steam-workshop-publishing
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      notes_sha256: ${{ steps.package.outputs.notes_sha256 }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      PUBLISH_REQUESTED: ${{ github.event_name == 'release' || inputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate the version tag and main-branch ancestry
        id: source
        run: |
          python3 -c 'import os,sys; sys.path.insert(0,"tools"); from build import release_version; release_version(os.environ["RELEASE_TAG"])'
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          printf 'sha=%s\ntag=%s\npublish=%s\n' "$(git rev-parse HEAD)" "$RELEASE_TAG" "$PUBLISH_REQUESTED" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Read the published release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$PUBLISH_REQUESTED" = 'true' ]; then
            gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/release-notes.txt"
          else
            : > "$RUNNER_TEMP/release-notes.txt"
          fi
      - name: Build, check and stage the exact release bytes
        run: |
          python3 tools/verify.py --tag "$RELEASE_TAG" --evidence "$RUNNER_TEMP/verification"
          python3 tools/workshop.py stage --tag "$RELEASE_TAG" --archive "$RUNNER_TEMP/verification/package/AutoMindful-${RELEASE_TAG#v}.zip" --manifest "$RUNNER_TEMP/verification/package/manifest.json" --out "$RUNNER_TEMP/workshop" --notes-file "$RUNNER_TEMP/release-notes.txt"
      - name: Record the checked release identity
        id: package
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          package = json.loads((root / "verification/package/manifest.json").read_text())
          values = {
              "archive_sha256": package["archiveSha256"],
              "notes_sha256": hashlib.sha256((root / "release-notes.txt").read_bytes()).hexdigest(),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("".join(f"{key}={value}\n" for key, value in values.items()))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("Checked " + os.environ["RELEASE_TAG"] + "\n\n")
              summary.write("".join(f"{key}: `{value}`\n\n" for key, value in values.items()))
          PY
      - name: Require the latest published stable release
        if: github.event_name == 'release' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$latest" = "$RELEASE_TAG" || { echo 'Only the latest published stable release may update Workshop.'; exit 1; }
      - name: Attach the checked release archive
        if: github.event_name == 'release' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/verification/package/AutoMindful-${RELEASE_TAG#v}.zip" "$RUNNER_TEMP/verification/package/manifest.json" "$RUNNER_TEMP/release-notes.txt" --clobber
  publish:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.publish == 'true'
    runs-on: [self-hosted, Linux, X64, automindful-publisher]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - name: Download the checked release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --pattern "AutoMindful-${RELEASE_TAG#v}.zip" --pattern manifest.json --pattern release-notes.txt --dir "$RUNNER_TEMP/checked-release"
      - name: Verify the cloud build identity and reconstruct its stage
        env:
          ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
          NOTES_SHA256: ${{ needs.build.outputs.notes_sha256 }}
        run: |
          python3 -c 'import hashlib,os; from pathlib import Path; root=Path(os.environ["RUNNER_TEMP"])/"checked-release"; tag=os.environ["RELEASE_TAG"]; assert hashlib.sha256((root/f"AutoMindful-{tag[1:]}.zip").read_bytes()).hexdigest()==os.environ["ARCHIVE_SHA256"],"Release archive differs from the passing cloud build"; assert hashlib.sha256((root/"release-notes.txt").read_bytes()).hexdigest()==os.environ["NOTES_SHA256"],"Release notes differ from the passing cloud build"'
          python3 tools/workshop.py stage --tag "$RELEASE_TAG" --archive "$RUNNER_TEMP/checked-release/AutoMindful-${RELEASE_TAG#v}.zip" --manifest "$RUNNER_TEMP/checked-release/manifest.json" --notes-file "$RUNNER_TEMP/checked-release/release-notes.txt" --out "$RUNNER_TEMP/checked-release/workshop"
      - name: Recheck the latest published stable release before upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$latest" = "$RELEASE_TAG" || { echo 'Only the latest published stable release may update Workshop.'; exit 1; }
      - name: Update Workshop through the signed-in desktop Steam client
        env:
          PZ_GAME_DIR: ${{ vars.PZ_GAME_DIR }}
          STEAM_WORKSHOP_ID: ${{ vars.STEAM_WORKSHOP_ID }}
        run: python3 tools/publish_desktop.py --game "$PZ_GAME_DIR" --stage "$RUNNER_TEMP/checked-release/workshop" --item-id "$STEAM_WORKSHOP_ID"
      - name: Remove the downloaded staging folder
        if: always()
        run: rm -rf "$RUNNER_TEMP/checked-release"
