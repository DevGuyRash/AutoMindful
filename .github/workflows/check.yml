name: Check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: python3 tools/verify.py
      - name: Check out pinned B42 menu and timed action sources
        uses: actions/checkout@v4
        with:
          repository: Project-Zomboid-Community-Modding/ProjectZomboid-Vanilla-Lua
          ref: 3b21e63fe4905a0a300a4021d05d01a9bb534729
          path: .stock-aim/lua
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /client/TimedActions/ISTimedActionQueue.lua
            /shared/TimedActions/ISBaseTimedAction.lua
            /shared/TimedActions/ISTakePillAction.lua
            /client/ISUI/ISInventoryPaneContextMenu.lua
            /client/ISUI/ISContextMenu.lua
      - name: Replay stock menu and action lifecycles
        run: |
          lua5.1 tests/stock_queue.lua .stock-aim
          lua5.1 tests/stock_aim.lua .stock-aim
          lua5.1 tests/stock_pain.lua .stock-aim
          lua5.1 tests/stock_context_icons.lua .stock-aim
